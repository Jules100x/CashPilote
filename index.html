const STORE = "cashpilot-v6-deep";

const DEFAULT_STATE = {
  answers:{},
  answerHistory:[],
  asked:[],
  progress:0,
  confidence:0,
  ranking:[],
  chosen:null,
  period:1,
  tasks:[],
  results:{
    contacts:0,
    responses:0,
    sales:0,
    revenue:0,
    costs:0,
    hours:0
  },
  events:[],
  decision:null,
  currentQuestion:null
};

function freshState(){
  return JSON.parse(JSON.stringify(DEFAULT_STATE));
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORE);

    if(!raw) return freshState();

    const parsed = JSON.parse(raw);

    return {
      ...freshState(),
      ...parsed,
      answers: parsed.answers || {},
      answerHistory: Array.isArray(parsed.answerHistory)
        ? parsed.answerHistory : [],
      asked: Array.isArray(parsed.asked)
        ? parsed.asked : [],
      ranking: Array.isArray(parsed.ranking)
        ? parsed.ranking : [],
      tasks: Array.isArray(parsed.tasks)
        ? parsed.tasks : [],
      events: Array.isArray(parsed.events)
        ? parsed.events : [],
      results:{
        ...DEFAULT_STATE.results,
        ...(parsed.results || {})
      }
    };
  }
  catch(error){
    console.warn("CashPilot : ancien état local invalide.",error);
    localStorage.removeItem(STORE);
    return freshState();
  }
}

let state = loadState();

function save(){
  try{
    localStorage.setItem(STORE,JSON.stringify(state));
  }catch(error){
    console.warn("CashPilot : sauvegarde locale impossible.",error);
  }
}

function show(id){
  document.querySelectorAll(".screen")
    .forEach(x=>x.classList.remove("active"));

  const target=document.getElementById(id);

  if(target){
    target.classList.add("active");
  }

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

/* =========================================================
   SAFE VALUE MAPPING
   IMPORTANT:
   unanswered questions are no longer treated as "average".
   ========================================================= */

function mapped(value,map){
  if(value===undefined || value===null) return null;
  return Object.prototype.hasOwnProperty.call(map,value)
    ? map[value]
    : null;
}

function averageKnown(arr){
  const valid=arr.filter(Number.isFinite);
  if(!valid.length) return null;
  return valid.reduce((a,b)=>a+b,0)/valid.length;
}

function fallback(value,def=3){
  return Number.isFinite(value) ? value : def;
}

function localPotential(a){

  if(a.area===undefined) return null;

  let score={
    metro:5,
    city:4,
    small:3,
    rural:2
  }[a.area] ?? 3;

  if(a.mobility!==undefined){
    if(a.mobility==="none") score-=2;
    if(a.mobility==="car") score+=1;
    if(a.mobility==="wide") score+=1;
  }

  return Math.max(1,Math.min(5,score));
}

/* =========================================================
   PURE SCORING
   No save()
   No state mutation
   No recursive progress calculation
   ========================================================= */

function similarity(human,ideal){
  if(!Number.isFinite(human) || !Number.isFinite(ideal)) return null;
  return Math.max(0,100-(Math.abs(human-ideal)*22));
}

function weightedAverage(arr){

  if(!arr.length) return null;

  let sum=0;
  let totalWeight=0;

  arr.forEach(x=>{
    if(Number.isFinite(x.value)){
      sum+=x.value*x.weight;
      totalWeight+=x.weight;
    }
  });

  if(!totalWeight) return null;

  return Math.round(sum/totalWeight);
}

function scoreStrategy(s,h){

  let eliminated=false;
  const eliminationReasons=[];

  if(
    s.req?.computer &&
    Number.isFinite(h.computer) &&
    h.computer<s.req.computer
  ){
    eliminated=true;
    eliminationReasons.push("matériel informatique insuffisant");
  }

  for(const refusal of h.hardNo){

    if(refusal==="none") continue;

    if(s.hard?.includes(refusal)){
      eliminated=true;
      eliminationReasons.push("incompatible avec un refus déclaré");
    }
  }

  if(
    s.family==="Local" &&
    state.answers.mobility==="none"
  ){
    eliminated=true;
    eliminationReasons.push("mobilité incompatible");
  }

  if(
    s.family==="Local" &&
    state.answers.localPreference==="never"
  ){
    eliminated=true;
    eliminationReasons.push("activité physique refusée");
  }

  const dims={
    human:[],
    skills:[],
    resources:[],
    geography:[],
    acquisition:[],
    economics:[]
  };

  function push(group,hv,sv,weight=1){

    const value=similarity(hv,sv);

    if(value===null) return;

    dims[group].push({
      value,
      weight
    });
  }

  push("skills",h.digital,s.ideal.digital,1.1);
  push("skills",h.tech,s.ideal.tech,1.1);
  push("skills",h.creative,s.ideal.creative,.8);

  push("human",h.client,s.ideal.client,1);
  push("human",h.patience,s.ideal.patience,1);
  push("human",h.scale,s.ideal.scale,.7);

  if(Number.isFinite(h.autonomy)){
    push("human",h.autonomy,4,.6);
  }

  push("resources",h.capital,s.ideal.capital,1.4);

  /*
    Time is not compared to a generic "3" anymore.
    Fast client services tolerate more available time,
    scalable assets generally benefit from larger time commitment.
  */

  if(Number.isFinite(h.time)){
    let idealTime=3;

    if(["Logiciel","Audience","Produit"].includes(s.family)){
      idealTime=4;
    }

    if(["Local","Vente","Service"].includes(s.family)){
      idealTime=3;
    }

    push("resources",h.time,idealTime,.8);
  }

  push("geography",h.remote,s.ideal.remote,1.3);

  if(s.family==="Local"){
    push("geography",h.geoLocal,5,1.5);
  }

  push("acquisition",h.sales,s.ideal.sales,1.5);

  if(Number.isFinite(h.rejection)){
    push(
      "acquisition",
      h.rejection,
      s.ideal.sales>=4 ? 5 : 3,
      1.2
    );
  }

  push("economics",h.speed,s.ideal.speed,1.3);

  const sub={};

  Object.keys(dims).forEach(k=>{
    sub[k]=weightedAverage(dims[k]);
  });

  let modifier=0;

  if(
    ["Vente","Acquisition","Intermédiation","Agence"].includes(s.family) &&
    Number.isFinite(h.network)
  ){
    modifier+=(h.network-3)*2;
  }

  if(
    ["Audience","Contenu","Création"].includes(s.family) &&
    Number.isFinite(h.audience)
  ){
    modifier+=(h.audience-3)*2;
  }

  if(
    ["digitalproduct","course","newsletter","affiliate"].includes(s.id) &&
    state.answers.incomeUrgency==="urgent"
  ){
    modifier-=8;
  }

  if(
    ["microsaas","nocodeapp"].includes(s.id) &&
    ["no","little"].includes(state.answers.learning)
  ){
    modifier-=8;
  }

  if(
    ["ecommerce","resale"].includes(s.id) &&
    ["0","150"].includes(state.answers.capital)
  ){
    modifier-=12;
  }

  if(
    ["leadgen","appointment","broker"].includes(s.id) &&
    state.answers.coldOutreach==="love"
  ){
    modifier+=6;
  }

  if(
    s.id==="closing" &&
    state.answers.phoneSales==="strong"
  ){
    modifier+=7;
  }

  if(
    s.id==="video" &&
    state.answers.video==="paid"
  ){
    modifier+=9;
  }

  if(
    s.id==="ghostwriting" &&
    state.answers.writing==="strong"
  ){
    modifier+=9;
  }

  if(
    s.id==="automation" &&
    state.answers.automation==="advanced"
  ){
    modifier+=10;
  }

  if(
    s.id==="nocode" &&
    ["nocode","code"].includes(state.answers.website)
  ){
    modifier+=8;
  }

  if(
    s.id==="ugc" &&
    state.answers.camera==="love"
  ){
    modifier+=8;
  }

  if(
    s.family==="Local" &&
    state.answers.localPreference==="prefer"
  ){
    modifier+=10;
  }

  /*
    B2B / B2C preference
  */

  if(state.answers.b2b==="business"){

    if([
      "Acquisition","Vente","Automatisation",
      "Conseil digital","Marketing","Opérations",
      "Agence","Expertise","Intermédiation"
    ].includes(s.family)){
      modifier+=4;
    }

    if(s.id==="local_b2c"){
      modifier-=5;
    }
  }

  if(state.answers.b2b==="consumer"){

    if([
      "Acquisition","Vente","Automatisation",
      "Conseil digital","Opérations"
    ].includes(s.family)){
      modifier-=4;
    }

    if(["ecommerce","resale","local_b2c","ugc"].includes(s.id)){
      modifier+=4;
    }
  }

  /*
    Camera compatibility
  */

  if(
    s.id==="ugc" &&
    state.answers.camera==="never"
  ){
    eliminated=true;
    eliminationReasons.push("visibilité personnelle incompatible");
  }

  /*
    Client relationship hard refusal
  */

  if(
    h.hardNo.includes("clients") &&
    s.ideal.client>=4
  ){
    modifier-=14;
  }

  /*
    Capital refusal
  */

  if(
    h.hardNo.includes("money") &&
    s.ideal.capital>=3
  ){
    modifier-=15;
  }

  const weights={
    human:1.15,
    skills:1.2,
    resources:1.15,
    geography:1,
    acquisition:1.25,
    economics:1.1
  };

  let total=0;
  let totalWeight=0;

  Object.keys(weights).forEach(k=>{

    if(Number.isFinite(sub[k])){
      total+=sub[k]*weights[k];
      totalWeight+=weights[k];
    }
  });

  /*
    IMPORTANT:
    If only a tiny part of the profile is known,
    we do not allow an artificially high score.
  */

  const measuredDimensions=
    Object.values(sub)
      .filter(Number.isFinite)
      .length;

  let score=totalWeight
    ? total/totalWeight
    : 50;

  score+=modifier;

  if(measuredDimensions<=2){
    score=Math.min(score,68);
  }
  else if(measuredDimensions===3){
    score=Math.min(score,76);
  }

  if(
    Number.isFinite(sub.acquisition) &&
    sub.acquisition<45 &&
    s.ideal.sales>=4
  ){
    score=Math.min(score,72);
  }

  if(
    Number.isFinite(sub.geography) &&
    sub.geography<45 &&
    s.family==="Local"
  ){
    score=Math.min(score,68);
  }

  if(
    Number.isFinite(sub.resources) &&
    sub.resources<42
  ){
    score=Math.min(score,70);
  }

  if(eliminated){
    score=Math.min(score,38);
  }

  score=Math.round(
    Math.max(20,Math.min(96,score))
  );

  return{
    ...s,
    score,
    sub,
    eliminated,
    eliminationReasons,
    measuredDimensions
  };
}

function calculateRanking(store=false){

  const h=buildHuman();

  const ranking=STRATEGIES
    .map(s=>scoreStrategy(s,h))
    .sort((a,b)=>{

      if(a.eliminated!==b.eliminated){
        return a.eliminated ? 1 : -1;
      }

      return b.score-a.score;
    });

  if(store){
    state.ranking=ranking;
  }

  return ranking;
}

function startDiagnostic(){

  const preservedEvents=Array.isArray(state.events)
    ? state.events
    : [];

  state=freshState();

  /*
    A new diagnostic is a new profile test.
    Existing project history is intentionally not reused.

  state.events=[];

  save();

  show("diagnostic");

  renderNextQuestion();
}

function eligibleQuestions(){

  return QUESTIONS.filter(q=>{

    if(state.asked.includes(q.id)){
      return false;
    }

    if(q.depends){

      try{
        if(!q.depends(state.answers)){
          return false;
        }
      }
      catch(error){
        return false;
      }
    }

    return true;
  });
}

function discriminationValue(q,top){

  const categoryMap={
    "Commercial":"sales",
    "Digital":"digital",
    "Technique":"tech",
    "Créatif":"creative",
    "Client":"client",
    "Mode de travail":"remote",
    "Risque":"capital",
    "Objectif":"speed",
    "Ambition":"scale",
    "Géographie":"remote",
    "Ressources":"capital"
  };

  const dimension=categoryMap[q.category];

  if(!dimension) return 0;

  const values=top
    .map(s=>s.ideal?.[dimension])
    .filter(Number.isFinite);

  if(values.length<2) return 0;

  return(
    Math.max(...values)-
    Math.min(...values)
  )*3;
}

function nextQuestion(ranking=null){

  const available=eligibleQuestions();

  if(!available.length){
    return null;
  }

  /*
    Foundation phase.
    The engine first establishes the minimum reliable profile.
  */

  if(state.asked.length<9){

    return [...available]
      .sort((a,b)=>b.priority-a.priority)[0];
  }

  const currentRanking=
    ranking || calculateRanking(false);

  const top=currentRanking
    .filter(x=>!x.eliminated)
    .slice(0,5);

  let best=null;
  let bestValue=-Infinity;

  for(const q of available){

    let value=
      q.priority*.15 +
      q.weight;

    if(top.length>=2){
      value+=discriminationValue(q,top);
    }

    if(
      q.category==="Géographie" &&
      top.some(x=>[
        "Local","Commerce"
      ].includes(x.family))
    ){
      value+=9;
    }

    if(
      q.category==="Commercial" &&
      top.some(x=>[
        "Vente","Acquisition",
        "Agence","Intermédiation"
      ].includes(x.family))
    ){
      value+=9;
    }

    if(
      q.category==="Technique" &&
      top.some(x=>[
        "Logiciel","Automatisation",
        "Conseil digital","Opérations"
      ].includes(x.family))
    ){
      value+=9;
    }

    if(
      q.category==="Créatif" &&
      top.some(x=>[
        "Création","Contenu",
        "Audience","Marketing"
      ].includes(x.family))
    ){
      value+=9;
    }

    if(
      q.category==="Client" &&
      top.some(x=>x.ideal.client>=4)
    ){
      value+=6;
    }

    if(value>bestValue){
      bestValue=value;
      best=q;
    }
  }

  return best;
}

/* =========================================================
   PROGRESS
   Progress no longer calls calculateRanking()
   ========================================================= */

const TOTAL_INFORMATION_WEIGHT =
  QUESTIONS.reduce(
    (sum,q)=>sum+q.weight,
    0
  );

function calculateProgress(){

  const answered=QUESTIONS.filter(
    q=>state.answers[q.id]!==undefined
  );

  const gained=answered.reduce(
    (sum,q)=>sum+q.weight,
    0
  );

  /*
    The percentage is an information-completeness indicator,
    not a question counter.

    We intentionally use a compressed curve:
    high-value early questions move the bar faster.
  */

  const raw=
    TOTAL_INFORMATION_WEIGHT
      ? gained/TOTAL_INFORMATION_WEIGHT
      : 0;

  const curved=Math.pow(raw,.78);

  let pct=Math.round(curved*100);

  /*
    Never display 100 before the diagnostic is actually closed.
  */

  if(pct>=100 && eligibleQuestions().length){
    pct=99;
  }

  return Math.max(
    answered.length ? 2 : 0,
    Math.min(99,pct)
  );
}

/* =========================================================
   CONFIDENCE
   Ranking passed as argument: no duplicate recursive chain.
   ========================================================= */

function calculateConfidence(ranking){

  const a=state.answers;

  const critical=[
    "goal",
    "incomeUrgency",
    "weeklyHours",
    "capital",
    "area",
    "mobility",
    "computer",
    "coldOutreach",
    "digitalComfort",
    "rejection",
    "hardNo",
    "clientContact",
    "b2b"
  ];

  const important=[
    "lossTolerance",
    "phoneSales",
    "negotiation",
    "learning",
    "uncertainty",
    "scaleAmbition",
    "network",
    "audience"
  ];

  let score=0;

  critical.forEach(k=>{
    if(a[k]!==undefined){
      score+=4.7;
    }
  });

  important.forEach(k=>{
    if(a[k]!==undefined){
      score+=2.1;
    }
  });

  const extraCount=
    Object.keys(a).filter(
      k=>!critical.includes(k) &&
         !important.includes(k)
    ).length;

  score+=Math.min(
    12,
    extraCount*.75
  );

  const viable=(ranking || [])
    .filter(x=>!x.eliminated);

  if(viable.length>=2){

    const gap=
      viable[0].score-
      viable[1].score;

    if(gap>=12) score+=10;
    else if(gap>=8) score+=8;
    else if(gap>=5) score+=6;
    else if(gap>=3) score+=3;
  }

  /*
    If top strategies are still extremely close,
    confidence must remain limited.
  */

  if(
    viable.length>=3 &&
    viable[0].score-viable[2].score<=2
  ){
    score=Math.min(score,78);
  }

  return Math.round(
    Math.max(0,Math.min(96,score))
  );
}

function coreProfileComplete(){

  const required=[
    "goal",
    "incomeUrgency",
    "weeklyHours",
    "capital",
    "area",
    "mobility",
    "computer",
    "coldOutreach",
    "digitalComfort",
    "rejection",
    "hardNo"
  ];

  return required.every(
    key=>state.answers[key]!==undefined
  );
}

function shouldFinish(ranking,confidence){

  const viable=ranking.filter(
    x=>!x.eliminated
  );

  if(!viable.length){
    return false;
  }

  if(!coreProfileComplete()){
    return false;
  }

  const top=viable[0];
  const second=viable[1];

  const gap=
    second
      ? top.score-second.score
      : 20;

  const answeredCount=
    Object.keys(state.answers).length;

  /*
    EASY PROFILE:
    clear high compatibility + clear gap.
    Can finish earlier.
  */

  if(
    answeredCount>=15 &&
    confidence>=82 &&
    top.score>=84 &&
    gap>=7
  ){
    return true;
  }

  /*
    NORMAL PROFILE.
  */

  if(
    answeredCount>=22 &&
    confidence>=86 &&
    top.score>=80 &&
    gap>=4
  ){
    return true;
  }

  /*
    COMPLEX PROFILE:
    top strategies are close.
    Keep asking until much more information exists.
  */

  if(
    answeredCount>=30 &&
    confidence>=88 &&
    top.score>=76 &&
    gap>=2
  ){
    return true;
  }

  /*
    Maximum available information.
    We finish even if no 80% match exists.
  */

  if(!eligibleQuestions().length){
    return true;
  }

  return false;
}

function renderNextQuestion(){

  /*
    One ranking calculation per transition.
  */

  const ranking=calculateRanking(false);

  state.progress=calculateProgress();
  state.confidence=
    calculateConfidence(ranking);

  updateProgress();

  if(
    shouldFinish(
      ranking,
      state.confidence
    )
  ){
    finishDiagnostic(ranking);
    return;
  }

  const q=nextQuestion(ranking);

  if(!q){
    finishDiagnostic(ranking);
    return;
  }

  renderQuestion(q);

  save();
}

/* =========================================================
   QUESTION RENDERING
   ========================================================= */

let multiTemp=[];

function renderQuestion(q){

  if(!q) return;

  const container=
    document.getElementById("questionContainer");

  if(!container) return;

  document.getElementById("infoGain").textContent=
    q.weight>=7
      ? "Cette réponse influence fortement le diagnostic."
      : q.weight>=5
        ? "Cette réponse affine la compatibilité."
        : "";

  let html=`
    <div class="eyebrow">${q.category}</div>
    <h1>${q.title}</h1>
    <p class="questionText">${q.text}</p>
  `;

  if(q.multi){

    multiTemp=
      Array.isArray(state.answers[q.id])
        ? [...state.answers[q.id]]
        : [];

    html+=`
      <div class="options">
        ${q.options.map(o=>`
          <button
            type="button"
            class="option multiOption ${multiTemp.includes(o[0])?"selected":""}"
            id="multi_${o[0]}"
            onclick="toggleMulti('${q.id}','${o[0]}')"
          >
            <span class="fakeCheck">
              ${multiTemp.includes(o[0])?"✓":""}
            </span>

            <span>
              <strong>${o[1]}</strong>
              <small>${o[2]}</small>
            </span>
          </button>
        `).join("")}
      </div>

      <div class="actions">
        <button
          type="button"
          class="btn"
          onclick="confirmMulti('${q.id}')"
        >
          Continuer →
        </button>
      </div>
    `;
  }

  else{

    html+=`
      <div class="options">
        ${q.options.map(o=>`
          <button
            type="button"
            class="option"
            onclick="answer('${q.id}','${o[0]}')"
          >
            <strong>${o[1]}</strong>
            <small>${o[2]}</small>
          </button>
        `).join("")}
      </div>
    `;
  }

  container.innerHTML=html;

  const back=
    document.getElementById("backButton");

  if(back){
    back.style.visibility=
      state.answerHistory.length
        ? "visible"
        : "hidden";
  }

  state.currentQuestion=q.id;
}

function answer(id,value){

  state.answerHistory.push({
    id,
    previous:state.answers[id]
  });

  state.answers[id]=value;

  if(!state.asked.includes(id)){
    state.asked.push(id);
  }

  save();

  renderNextQuestion();
}

function toggleMulti(id,value){

  if(value==="none"){

    multiTemp=["none"];

  }else{

    multiTemp=
      multiTemp.filter(x=>x!=="none");

    if(multiTemp.includes(value)){

      multiTemp=
        multiTemp.filter(x=>x!==value);

    }else{

      multiTemp.push(value);
    }
  }

  document
    .querySelectorAll("[id^='multi_']")
    .forEach(el=>{

      const v=
        el.id.replace("multi_","");

      const selected=
        multiTemp.includes(v);

      el.classList.toggle(
        "selected",
        selected
      );

      const check=
        el.querySelector(".fakeCheck");

      if(check){
        check.textContent=
          selected ? "✓" : "";
      }
    });
}

function confirmMulti(id){

  if(!multiTemp.length){
    return;
  }

  state.answerHistory.push({
    id,
    previous:state.answers[id]
  });

  state.answers[id]=[
    ...multiTemp
  ];

  multiTemp=[];

  if(!state.asked.includes(id)){
    state.asked.push(id);
  }

  save();

  renderNextQuestion();
}

function goBack(){

  const last=
    state.answerHistory.pop();

  if(!last){
    return;
  }

  state.asked=
    state.asked.filter(
      x=>x!==last.id
    );

  if(last.previous===undefined){
    delete state.answers[last.id];
  }else{
    state.answers[last.id]=last.previous;
  }

  const q=
    QUESTIONS.find(
      x=>x.id===last.id
    );

  const ranking=
    calculateRanking(false);

  state.progress=
    calculateProgress();

  state.confidence=
    calculateConfidence(ranking);

  updateProgress();

  renderQuestion(q);

  save();
}

function updateProgress(){

  const percent=
    document.getElementById(
      "progressPercent"
    );

  const bar=
    document.getElementById(
      "progressBar"
    );

  if(percent){
    percent.textContent=
      state.progress+" %";
  }

  if(bar){
    bar.style.width=
      state.progress+"%";
  }
}

/* =========================================================
   FINISH
   ========================================================= */

function finishDiagnostic(existingRanking=null){

  const ranking=
    existingRanking ||
    calculateRanking(false);

  state.ranking=ranking;

  state.progress=100;

  state.confidence=
    Math.max(
      state.confidence,
      calculateConfidence(ranking)
    );

  save();

  show("analysis");

  const viable=
    ranking.filter(
      x=>!x.eliminated
    );

  const top=viable[0];

  document.getElementById(
    "analysisStrategies"
  ).textContent=
    STRATEGIES.length;

  document.getElementById(
    "analysisCompleteness"
  ).textContent=
    "100 %";

  document.getElementById(
    "analysisConfidence"
  ).textContent=
    state.confidence+" %";

  const geo=
    document.getElementById(
      "analysisGeo"
    );

  if(geo){

    geo.textContent=
      state.answers.area
        ? "analysée"
        : "partielle";
  }

  setTimeout(
    renderResults,
    700
  );
}

function subscoreBox(label,value){

  return`

}

function strategyRow(
  s,
  rank,
  full=false
){

  return`
    <div class="strategyRow ${s.eliminated?"eliminated":""}">

      <div class="rank">
        #${rank}
      </div>

      <div>
        <h3>${s.name}</h3>

        <p>
          ${s.family}

            s.eliminated
              ? " · incompatible : "+
                s.eliminationReasons.join(", ")
              : full
                ? " · "+s.tags.join(" · ")
                : ""
          }

      </div>

      <div class="rowScore">
        ${s.score}%
      </div>

    </div>
  `;
}

function winnerReasons(s){

  const parts=[];

  if(
    Number.isFinite(s.sub.skills) &&
    s.sub.skills>=80
  ){
    parts.push(
      "tes compétences correspondent bien au modèle"
    );
  }

  if(
    Number.isFinite(s.sub.acquisition) &&
    s.sub.acquisition>=80
  ){
    parts.push(
      "ton profil commercial correspond à son mode d'acquisition"
    );
  }

  if(
    Number.isFinite(s.sub.resources) &&
    s.sub.resources>=80
  ){
    parts.push(
      "tes ressources permettent de le tester dans de bonnes conditions"
    );
  }

  if(
    Number.isFinite(s.sub.geography) &&
    s.sub.geography>=80
  ){
    parts.push(
      "ta situation géographique est compatible"
    );
  }

  if(
    Number.isFinite(s.sub.human) &&
    s.sub.human>=80
  ){
    parts.push(
      "son fonctionnement correspond à ta manière de travailler"
    );
  }

  if(!parts.length){

    return "Cette stratégie présente actuellement le meilleur compromis entre ton profil, tes contraintes et les exigences du modèle.";
  }

  return capitalize(
    parts.slice(0,3).join(", ")
  )+".";
}

function winnerWarning(s){

  const entries=[
    ["Acquisition",s.sub.acquisition],
    ["Ressources",s.sub.resources],
    ["Compétences",s.sub.skills],
    ["Géographie",s.sub.geography],
    ["Profil humain",s.sub.human]
  ]
  .filter(
    x=>Number.isFinite(x[1])
  )
  .sort(
    (a,b)=>a[1]-b[1]
  );

  if(!entries.length){

    return "Le profil doit encore être validé par des résultats réels.";
  }

  return(
    `${entries[0][0]} : ${entries[0][1]} %. `+
    `C'est actuellement la dimension la moins compatible et celle à surveiller pendant la validation.`
  );
}

function capitalize(s){
  return s.charAt(0).toUpperCase()+s.slice(1);
}

  if(v>=3.6)return "Élevé";

    state.ranking.find(
      x=>x.id===state.chosen
    );

  if(!strategy){
    return;
  }

  state.period=1;

  state.results={
    contacts:0,
    responses:0,
    sales:0,
    revenue:0,
    costs:0,
    hours:0
  };

  state.tasks=
    initialTasks(strategy);

  state.events=[
    {
      title:"Diagnostic terminé",
      text:
        `${strategy.name} sélectionné avec `+
        `${strategy.score}% de compatibilité et `+
        `${state.confidence}% de confiance.`,

    }
  ];

  state.decision=null;

  save();

  show("app");

  renderApp();
}

/* =========================================================
   TASK SYSTEM
   todo / progress / done / blocked
   ========================================================= */

function taskStatusLabel(status){

  return{
    todo:"À faire",
    progress:"En cours",
    done:"Terminé",
    blocked:"Bloqué"
  }[status] || "À faire";
}

function setTaskStatus(
  index,
  status
){

  const task=state.tasks[index];

  if(!task){
    return;
  }

  const previous=
    task.status || "todo";

  task.status=status;

  if(status!=="blocked"){
    task.blocker=null;
  }

  if(status==="blocked"){

    const reason=prompt(
      "Pourquoi cette action est-elle bloquée ?\n\n"+
      "Exemples : manque de temps, je ne sais pas comment faire, peur de contacter, pas assez de prospects..."
    );

    if(reason===null){

      task.status=previous;
      return;
    }

    task.blocker=
      reason.trim() ||
      "Blocage non précisé";
  }

  state.events.push({
    title:
      status==="done"
        ? "Action terminée"
        : status==="blocked"
          ? "Blocage détecté"
          : status==="progress"
            ? "Action commencée"
            : "Action remise à faire",

    text:
      status==="blocked"
        ? `${task.title} · ${task.blocker}`
        : task.title,

    date:new Date()
      .toLocaleDateString("fr-FR")
  });

  save();

  renderApp();
}

function toggleTask(index){

  const task=state.tasks[index];

  if(!task){
    return;
  }

  const current=
    task.status ||
    (task.done ? "done" : "todo");

  setTaskStatus(
    index,
    current==="done"
      ? "todo"
      : "done"
  );
}

function completion(){

  if(!state.tasks.length){
    return 0;
  }

  const done=
    state.tasks.filter(
      t=>
        (t.status || (t.done?"done":"todo"))
        ==="done"
    ).length;

  return Math.round(
    done/state.tasks.length*100
  );
}

function renderTask(t,i){

  const status=
    t.status ||
    (t.done ? "done" : "todo");

  const done=
    status==="done";

  return`
    <div class="task">

      <div
        class="checkbox ${done?"done":""}"
        onclick="toggleTask(${i})"
        title="${done?"Réouvrir":"Terminer"}"
      >
        ${done?"✓":""}
      </div>

      <div>

        <h3>${t.title}</h3>

        <p>${t.desc}</p>

        <p
          class="small"
          style="margin-top:7px"
        >
          ${t.target ? `Objectif : ${t.target}` : ""}
          ${t.minutes ? ` · ~${t.minutes} min` : ""}
          ${t.evidence ? ` · Preuve : ${t.evidence}` : ""}
        </p>

        ${
          t.blocker
          ? `
            <p
              class="small red"
              style="margin-top:6px"
            >
              Blocage : ${t.blocker}
            </p>
          `
          : ""
        }

        <div
          class="actions"
          style="margin-top:9px"
        >

          <button
            class="btn secondary smallBtn"
            onclick="setTaskStatus(${i},'todo')"
          >
            À faire
          </button>

          <button
            class="btn secondary smallBtn"
            onclick="setTaskStatus(${i},'progress')"
          >
            En cours
          </button>

          <button
            class="btn secondary smallBtn"
            onclick="setTaskStatus(${i},'done')"
          >
            Terminé
          </button>

          <button
            class="btn secondary smallBtn"
            onclick="setTaskStatus(${i},'blocked')"
          >
            Bloqué
          </button>

        </div>

      </div>

      <span class="taskStatus">
        ${taskStatusLabel(status)}
      </span>

    </div>
  `;
}

function analysePeriod(){

  const r=state.results;
  const pct=completion();

  const blocked=
    state.tasks.filter(t=>
      (t.status || "todo")==="blocked"
    );

  let decision;
  let title;
  let text;

  if(
    blocked.length>=2 &&
    pct<70
  ){

    decision="correct";

    title="CORRIGER";

    text=
      "Plusieurs actions sont bloquées. CashPilot recommande de traiter les freins d'exécution avant d'augmenter le volume.";
  }

  else if(pct<50){

    decision="repeat";

    title="RÉPÉTER";

    text=
      "Le problème principal est actuellement l'exécution. Changer de stratégie maintenant donnerait trop peu d'informations.";
  }

  else if(
    (r.sales>0 || r.revenue>0) &&
    pct>=80
  ){

    decision="accelerate";

    title="ACCÉLÉRER";

    text=
      "Un signal économique existe et l'exécution est suffisante. La prochaine période doit tester la répétabilité.";
  }

  else if(
    r.contacts>=10 &&
    r.responses===0
  ){

    decision="correct";

    title="CORRIGER";

    text=
      "Tu as suffisamment exécuté pour constater un problème d'acquisition. On corrige avant d'augmenter le volume.";
  }

  else if(
    r.responses>=2 &&
    r.sales===0
  ){

    decision="convert";

    title="AMÉLIORER L'OFFRE";

    text=
      "Le marché répond mais ne convertit pas encore. La stratégie reste pertinente, mais la proposition doit évoluer.";
  }

  else if(pct>=80){

    decision="continue";

    title="CONTINUER";

    text=
      "L'exécution est bonne mais le signal reste insuffisant pour accélérer ou abandonner.";
  }

  else{

    decision="repeat";

    title="CONSOLIDER";

    text=
      "Il manque encore suffisamment d'exécution ou de données pour prendre une décision fiable.";
  }

  state.decision=decision;

  document.getElementById(
    "decision"
  ).textContent=title;

  document.getElementById(
    "decisionText"
  ).textContent=text;

  document.getElementById(
    "nextPeriod"
  ).style.display="block";

  document.getElementById(
    "nextPeriodTitle"
  ).textContent=
    `CashPilot recommande : ${title}`;

  document.getElementById(
    "nextPeriodText"
  ).textContent=text;

  state.events.push({
    title:"Analyse de période",
    text:`Décision : ${title}. ${text}`,
    date:new Date()
      .toLocaleDateString("fr-FR")
  });

  save();

  renderTimeline();
}
