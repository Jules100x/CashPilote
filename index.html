<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080B14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="CashPilot trouve l’activité indépendante qui correspond vraiment à ton profil, puis t’aide à la lancer semaine après semaine.">
<title>CashPilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#080B14; --bg2:#0D1220; --card:#111729; --card2:#151C31; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --ink:#F3F4F8; --soft:#A9AEC2; --mute:#6E7590; --violet:#7C5CFF; --violet2:#9B83FF; --vglow:rgba(124,92,255,.35);
  --yellow:#FFD84D; --orange:#FF8A3D; --green:#3FD39A; --red:#FF6B6B;
  --r:18px; --rs:12px; --font:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100%;
  padding-top:env(safe-area-inset-top,0px);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:radial-gradient(ellipse 80% 45% at 85% -5%,rgba(124,92,255,.18),transparent 70%),radial-gradient(ellipse 60% 35% at 0% 0%,rgba(255,138,61,.07),transparent 70%)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
a{color:var(--violet2)}
h1,h2,h3{margin:0;letter-spacing:-.025em;line-height:1.15;font-weight:800}
p{margin:0}
.wrap{max-width:560px;margin:0 auto;padding:0 max(18px,env(safe-area-inset-right,0px)) 0 max(18px,env(safe-area-inset-left,0px))}
.top{display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{display:inline-flex;align-items:center;gap:9px;font-weight:800;font-size:19px;letter-spacing:-.03em;color:var(--ink);text-decoration:none;background:none;border:0;padding:0}
.logo .mk{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--violet),#5B3CF0);display:grid;place-items:center;box-shadow:0 6px 20px -6px var(--vglow)}
.logo .mk i{width:9px;height:9px;border-radius:50%;background:var(--yellow);display:block}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--soft);
  padding:5px 10px;border-radius:999px;border:1px solid var(--line2);background:rgba(255,255,255,.03);white-space:nowrap}
.chip.v{color:#CFC4FF;border-color:rgba(124,92,255,.45);background:rgba(124,92,255,.12)}
.chip.y{color:var(--yellow);border-color:rgba(255,216,77,.4);background:rgba(255,216,77,.08)}
.chip.o{color:var(--orange);border-color:rgba(255,138,61,.4);background:rgba(255,138,61,.08)}
.chip.g{color:var(--green);border-color:rgba(63,211,154,.35);background:rgba(63,211,154,.08)}
.chip.r{color:var(--red);border-color:rgba(255,107,107,.35);background:rgba(255,107,107,.08)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.muted{color:var(--soft)}
.small{font-size:14px}
.tn{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card.flat{background:var(--bg2)}
.card.hl{border-color:rgba(124,92,255,.45);box-shadow:0 20px 60px -30px var(--vglow)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 20px;border-radius:16px;border:1px solid var(--line2);
  background:rgba(255,255,255,.04);font-weight:700;font-size:16px;color:var(--ink);text-decoration:none;width:100%;transition:transform .15s,background .2s}
.btn:active{transform:scale(.985)}
.btn.pri{background:var(--violet);border-color:var(--violet);box-shadow:0 14px 34px -14px var(--vglow)}
.btn.yel{background:var(--yellow);border-color:var(--yellow);color:#14110A}
.btn.ghost{background:none}
.btn.sm{min-height:42px;font-size:14px;border-radius:12px;padding:0 14px;width:auto}
.btn.xs{min-height:34px;font-size:13px;border-radius:10px;padding:0 12px;width:auto}
.btn.danger{color:var(--red);border-color:rgba(255,107,107,.35)}
.btn[disabled]{opacity:.4;pointer-events:none}
.link{background:none;border:0;color:var(--soft);font-weight:600;padding:6px 0;text-decoration:underline;text-underline-offset:3px;font-size:14px}
:focus-visible{outline:2px solid var(--yellow);outline-offset:2px;border-radius:8px}
/* landing */
.hero{padding:26px 0 8px}
.hero h1{font-size:clamp(34px,9vw,46px);letter-spacing:-.04em;margin:14px 0 14px}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--yellow),var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent}
.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:800;font-size:13px;letter-spacing:.06em;margin-top:6px}
.flow span{padding:6px 10px;border-radius:10px;background:var(--bg2);border:1px solid var(--line)}
.flow b{color:var(--violet2)}
.steps{display:grid;gap:10px;margin:22px 0}
.step{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:16px;background:var(--bg2);border:1px solid var(--line)}
.step .n{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:14px;background:rgba(124,92,255,.15);color:var(--violet2)}
.step b{display:block;margin-bottom:2px}
.foot{padding:26px 0 calc(30px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:center}
/* quiz */
.qhead{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--bg) 70%,rgba(8,11,20,0));padding:8px 0 14px}
.prog{display:flex;align-items:baseline;justify-content:space-between;font-weight:700;font-size:14px;color:var(--soft)}
.prog b{color:var(--ink);font-size:15px}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--violet),var(--yellow));transition:width .5s cubic-bezier(.22,1,.36,1)}
.qbody{padding:14px 0 30px;animation:rise .35s cubic-bezier(.22,1,.36,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.qbody h2{font-size:clamp(24px,6.4vw,30px);margin:12px 0 8px}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;width:100%;min-height:64px;padding:14px 16px;border-radius:16px;border:1px solid var(--line2);background:var(--bg2);transition:border-color .15s,background .15s}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line2);display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--mute)}
.opt.multi .k{border-radius:7px}
.opt b{display:block;font-weight:700;font-size:16px;line-height:1.3}
.opt span.s{display:block;font-size:14px;color:var(--soft);margin-top:2px}
.opt.on{border-color:var(--violet);background:rgba(124,92,255,.12)}
.opt.on .k{background:var(--violet);border-color:var(--violet);color:#fff}
.opt.scale .k{width:auto;min-width:26px;padding:0 6px}
.qnav{display:flex;gap:10px;margin-top:20px}
.qnav .btn{flex:1}
.dynbox{border:1px dashed rgba(255,216,77,.4);background:rgba(255,216,77,.05);border-radius:14px;padding:12px 14px;margin-top:12px;font-size:14px;color:#F5E7B0}
/* results */
.score{display:flex;gap:12px;margin-top:16px}
.score > div{flex:1;padding:14px;border-radius:14px;background:var(--bg2);border:1px solid var(--line)}
.score .big{font-size:34px;font-weight:800;letter-spacing:-.04em;line-height:1}
.score .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-top:6px}
.notice{padding:14px 16px;border-radius:14px;font-size:15px;border:1px solid rgba(255,138,61,.4);background:rgba(255,138,61,.08);color:#FFD2B3}
.notice.v{border-color:rgba(124,92,255,.4);background:rgba(124,92,255,.08);color:#DCD3FF}
.list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.list li{display:flex;gap:10px;align-items:flex-start}
.list li::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;margin-top:8px;background:var(--green)}
.list.warn li::before{background:var(--orange)}
.dims{display:flex;flex-direction:column;gap:11px}
.dim .between{font-size:14px;font-weight:600}
.dim .t{height:7px;border-radius:9px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:6px}
.dim .t i{display:block;height:100%;border-radius:9px;background:var(--violet)}
.dim.hi .t i{background:var(--green)} .dim.lo .t i{background:var(--orange)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.facts div{padding:12px;border-radius:12px;background:var(--bg2);border:1px solid var(--line)}
.facts small{display:block;font-size:12px;color:var(--mute);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.facts b{font-size:15px}
.alt{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:var(--bg2);border:1px solid var(--line)}
.alt .sc{flex:none;width:52px;text-align:center;font-weight:800;font-size:18px}
.alt .nm{flex:1;min-width:0}
.alt .nm b{display:block;font-size:15px;line-height:1.3}
.alt .nm span{font-size:13px;color:var(--soft)}
details.rk{border:1px solid var(--line);border-radius:14px;background:var(--bg2);overflow:hidden}
details.rk summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
details.rk summary::-webkit-details-marker{display:none}
details.rk .pos{flex:none;width:26px;font-weight:800;color:var(--mute);font-size:13px}
details.rk .nm{flex:1;min-width:0;font-weight:600;font-size:14px;line-height:1.3}
details.rk .sc{flex:none;font-weight:800;font-size:15px}
details.rk .dbg{padding:4px 14px 14px;font-size:13px;color:var(--soft);display:flex;flex-direction:column;gap:8px}
.dbg table{width:100%;border-collapse:collapse}
.dbg td{padding:3px 0;border-bottom:1px solid var(--line);vertical-align:top}
.dbg td:last-child{text-align:right;color:var(--ink);font-weight:700}
.elim{opacity:.55}
/* espace projet */
.space{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(8,11,20,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:12px;color:var(--mute);font-size:10.5px;font-weight:700}
.tabs button svg{width:22px;height:22px}
.tabs button.on{color:var(--ink);background:rgba(124,92,255,.14)}
.tabs button.on svg{color:var(--violet2)}
.ph{padding:6px 0 4px}
.ph h1{font-size:28px;margin-top:6px}
.prio{border-color:rgba(255,216,77,.35);background:linear-gradient(180deg,rgba(255,216,77,.07),var(--card))}
.task{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:14px;background:var(--bg2);border:1px solid var(--line);text-align:left;width:100%}
.task .dot{flex:none;width:12px;height:12px;border-radius:50%;margin-top:6px;border:2px solid var(--mute)}
.task.doing .dot{border-color:var(--yellow);background:rgba(255,216,77,.3)}
.task.done .dot{border-color:var(--green);background:var(--green)}
.task.blocked .dot{border-color:var(--red);background:rgba(255,107,107,.35)}
.task.done b{color:var(--soft);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.25)}
.task .tx{flex:1;min-width:0}
.task b{display:block;font-size:15px;line-height:1.35}
.task span{display:block;font-size:13px;color:var(--soft);margin-top:2px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{min-height:46px;border-radius:12px;border:1px solid var(--line2);background:var(--bg2);font-size:13px;font-weight:700;padding:0 4px}
.seg button.on{border-color:var(--violet);background:rgba(124,92,255,.18)}
.seg button.on.done{border-color:var(--green);background:rgba(63,211,154,.15)}
.seg button.on.blocked{border-color:var(--red);background:rgba(255,107,107,.12)}
.seg button.on.doing{border-color:var(--yellow);background:rgba(255,216,77,.12)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--soft)}
input.in,textarea.in,select.in{width:100%;min-height:48px;padding:12px 14px;border-radius:12px;border:1px solid var(--line2);background:var(--bg);font-size:16px;font-weight:500}
textarea.in{min-height:84px;resize:vertical}
input.in:focus,textarea.in:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 3px rgba(124,92,255,.2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{padding:13px;border-radius:13px;background:var(--bg2);border:1px solid var(--line)}
.kpi small{display:block;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mute)}
.kpi b{font-size:22px;font-weight:800;letter-spacing:-.03em}
.kpi .pos{color:var(--green)}
.tl{display:flex;flex-direction:column}
.tl .d{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:14px 0 6px}
.tl .e{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.tl .e .ic{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:14px;background:var(--bg2);border:1px solid var(--line)}
.tl .e b{display:block;font-size:14.5px;font-weight:700}
.tl .e span{font-size:13px;color:var(--soft)}
.dec{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dec button{min-height:52px;border-radius:13px;border:1px solid var(--line2);background:var(--bg2);font-weight:800;font-size:13.5px;letter-spacing:.03em}
.dec button.rec{border-color:var(--yellow);color:var(--yellow)}
.dec button.on{background:rgba(124,92,255,.2);border-color:var(--violet);color:var(--ink)}
.stg{display:flex;gap:6px}
.stg i{flex:1;height:6px;border-radius:9px;background:rgba(255,255,255,.08)}
.stg i.d{background:var(--green)} .stg i.c{background:var(--yellow)}
.trait{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.trait span{color:var(--soft)}
.trait em{font-style:normal;font-size:11.5px;color:var(--mute);display:block;text-align:right}
/* sheet */
#sheet{position:fixed;inset:0;z-index:100;display:none}
#sheet.on{display:block}
#sheet .bk{position:absolute;inset:0;background:rgba(3,5,10,.66);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#sheet .pn{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--bg2);border-top:1px solid var(--line2);border-radius:22px 22px 0 0;
  padding:10px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:up .28s cubic-bezier(.22,1,.36,1) both}
#sheet .pn > div{max-width:560px;margin:0 auto}
#sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line2);margin:2px auto 14px}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:120;background:#1B2340;border:1px solid var(--line2);
  border-radius:999px;padding:11px 18px;font-weight:700;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
.toast.on{opacity:1}
.err{padding:22px;border-radius:18px;border:1px solid rgba(255,107,107,.4);background:rgba(255,107,107,.07)}
.err pre{white-space:pre-wrap;font-size:12px;color:var(--soft);background:var(--bg);padding:10px;border-radius:10px;max-height:160px;overflow:auto}
.cmp{width:100%;border-collapse:collapse;font-size:12.5px}
.cmp th,.cmp td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.cmp th{color:var(--mute);font-weight:800;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div class="wrap"><header class="top"><span class="logo"><span class="mk"><i></i></span>CashPilot</span></header></div>
  <main id="view" class="wrap">
    <section class="hero">
      <span class="chip v">Diagnostic adaptatif</span>
      <h1>Trouve l’activité qui correspond <em>vraiment</em> à qui tu es.</h1>
      <p class="muted">CashPilot analyse ta personnalité, tes compétences, ton temps, ton argent et tes refus, puis t’aide à lancer ton activité semaine après semaine.</p>
      <noscript><p class="notice" style="margin-top:16px">JavaScript est nécessaire pour utiliser CashPilot.</p></noscript>
    </section>
  </main>
</div>
<div id="sheet"><div class="bk" data-act="sheet-close"></div><div class="pn"><div id="sheetBody"></div></div></div>
<div class="toast" id="toast"></div>
<script>
/* =========================================================
   CATALOGUE DES STRATÉGIES
   Chaque fiche décrit le business de façon structurée.
   Les valeurs 0..1 décrivent l'intensité d'une exigence.
   ========================================================= */
var STRAT_DEFAULTS = {
  family: 'service', market: 'B2B', nature: 'digital',
  solo: 1, remote: 1, capitalMin: 0, costs: 0, hoursMin: 6, difficulty: 0.5,
  skillsReq: {}, skillsAdv: {}, skillCritical: false,
  rejection: 0.3, social: 0.4, clientRel: 0.5, support: 0.2, teaching: 0,
  calls: 0, prospecting: 0, face: 0, content: 0, selling: 0.5, manual: 0, meetings: 0.2,
  acq: { marketplace: 0.3, network: 0.3, outbound: 0.4 }, acqCritical: true,
  geo: 0, travel: 0, car: 0, onsite: 0, stock: 0, logistics: 0, storage: 0, workspace: 0, gear: 0,
  computer: 1, audience: 0, network: 0,
  validationWeeks: 6, recurrence: 0.5, scalability: 0.5, risk: 0.3, ceiling: 2500,
  selfDirected: 0.5, learningCurve: 0.5, daytime: 0.3, dailyNeed: 0.3, reinvestNeed: 0.2,
  interests: [],
  prereq: [], incompat: [], accel: [], entry: '', metrics: [], success: '', fail: '', pivot: '',
  phases: ['Validation', 'Premiers contacts', 'Premiers clients', 'Stabilisation', 'Croissance']
};

var STRATEGIES = [
  { id: 'leadgen', name: 'Génération de leads B2B', family: 'outbound', cat: 'Acquisition',
    desc: 'Constituer et qualifier des listes de prospects pour des entreprises qui vendent en B2B.',
    daily: 'Chercher, trier et qualifier des entreprises cibles dans des bases de données et sur LinkedIn',
    skillsReq: { sk_data: 0.35, sk_sheets: 0.4 }, skillsAdv: { sk_crm: 1, sk_prospecting: 1, sk_ai: 0.7, sk_english: 0.5 },
    rejection: 0.45, social: 0.35, clientRel: 0.45, calls: 0.15, prospecting: 0.6, selling: 0.55,
    acq: { outbound: 0.6, network: 0.25, marketplace: 0.15 }, validationWeeks: 4, recurrence: 0.7, scalability: 0.55, risk: 0.2, ceiling: 3000,
    hoursMin: 6, interests: ['int_sales', 'int_data'], daytime: 0.3,

    '<button class="btn pri" data-act="err-home">Revenir à l’accueil</button><button class="btn danger" data-act="reset-ask">Réinitialiser les données</button><details><summary class="small muted">Détail technique</summary><pre>' + esc(msg) + '</pre></details></div>';
}

/* ---------- accueil ---------- */

  if (!has) cta += '<button class="btn pri" data-act="start">Commencer mon diagnostic</button>';
  else cta += '<button class="btn ghost" data-act="restart-ask">Recommencer un diagnostic</button>';
  return (S.notice ? '<div class="notice v" style="margin-top:6px">' + esc(S.notice) + ' <button class="link" data-act="notice-ok">OK</button></div>' : '') +

    '<h1>Trouve l’activité qui correspond <em>vraiment</em> à qui tu es.</h1>' +

    '<div class="steps"><div class="step"><span class="n">1</span><div><b>Un diagnostic qui s’adapte à toi</b><span class="muted small">Chaque réponse choisit la question suivante. Certains profils sont clairs en quelques minutes, d’autres demandent plus de précision.</span></div></div>' +
    '<div class="step"><span class="n">2</span><div><b>Une recommandation expliquée</b><span class="muted small">' + STRATEGIES.length + ' modèles d’activité comparés, avec une compatibilité et une confiance distinctes. Aucun score gonflé.</span></div></div>' +
    '<div class="step"><span class="n">3</span><div><b>Un plan qui réagit à tes résultats</b><span class="muted small">Chaque période s’adapte à ce qui s’est vraiment passé : continuer, corriger, accélérer ou pivoter.</span></div></div></div>' +
    '<p class="muted small">Prototype : tes données restent sur cet appareil. Aucune promesse de revenu.</p>' +
    '<div class="foot"><button class="link" data-act="lab">Labo de test (profils A à E)</button><button class="link" data-act="reset-ask">Réinitialiser</button></div>';

/* ---------- questionnaire ---------- */
function vQuiz() {
  var q = currentQuestion();
  if (!q) { finishDiag(); save(); return vResult(); }
  var p = displayPct();
  var prev = UI.prevAnswer; UI.prevAnswer = undefined;
  var dimL = DIM_LABELS[q.dim] || '';
  var opts = '';
  if (q.multi) {
    var sel = UI.multi;
    opts = q.options.map(function (o, i) {
      var on = sel.indexOf(i) >= 0;
      return '<button class="opt multi' + (on ? ' on' : '') + '" data-act="multi" data-i="' + i + '"><span class="k">' + (on ? '✓' : '') + '</span><span><b>' + esc(o.l) + '</b>' + (o.s ? '<span class="s">' + esc(o.s) + '</span>' : '') + '</span></button>';
    }).join('');
    if (q.none) { var onN = sel.indexOf('none') >= 0; opts += '<button class="opt multi' + (onN ? ' on' : '') + '" data-act="multi" data-i="none"><span class="k">' + (onN ? '✓' : '') + '</span><span><b>' + esc(q.none.l) + '</b></span></button>'; }
  } else {
    opts = q.options.map(function (o, i) {
      var on = prev === i;
      return '<button class="opt' + (q.type === 'scale' ? ' scale' : '') + (on ? ' on' : '') + '" data-act="ans" data-i="' + i + '"><span class="k">' + (i + 1) + '</span><span><b>' + esc(o.l) + '</b>' + (o.s ? '<span class="s">' + esc(o.s) + '</span>' : '') + '</span></button>';
    }).join('');
  }
  var dyn = '';
  if (q.dynamic === 'tb') dyn = '<div class="dynbox">Plusieurs pistes sont au coude-à-coude. Ta réponse va les départager.</div>';
  if (q.dynamic === 'cx') dyn = '<div class="dynbox">Deux de tes réponses semblent se contredire. On vérifie plutôt que de faire une moyenne.</div>';
  var nav = '<div class="qnav"><button class="btn ghost" data-act="back">← Retour</button>' + (q.multi ? '<button class="btn pri" data-act="multi-ok"' + (UI.multi.length ? '' : ' disabled') + '>Continuer</button>' : '') + '</div>';
  return '<div class="qhead"><div class="prog"><span>Analyse de ton profil</span><b class="tn">' + p + ' %</b></div><div class="bar"><i style="width:' + Math.max(3, p) + '%"></i></div></div>' +
    '<div class="qbody">' + (dimL ? '<span class="chip">' + esc(dimL) + '</span>' : '') +
    '<h2>' + esc(q.text) + '</h2>' + (q.sub && !q.dynamic ? '<p class="muted">' + esc(q.sub) + '</p>' : '') + dyn +
    '<div class="opts">' + opts + '</div>' + nav +
    '<div style="text-align:center;margin-top:18px"><button class="link" data-act="quit">Enregistrer et quitter</button></div></div>';
}

/* ---------- résultats ---------- */
function dimRows(r) {
  return CP.DIMS.map(function (d) {
    var D = r.dims[d.id];
    if (D.score === null) return '<div class="dim"><div class="between"><span>' + d.l + '</span><span class="muted small">' + (D.irrelevant ? 'non concerné' : 'pas encore évalué') + '</span></div><div class="t"><i style="width:0"></i></div></div>';
    var cls = D.score >= 75 ? 'hi' : (D.score < 55 ? 'lo' : '');
    return '<div class="dim ' + cls + '"><div class="between"><span>' + d.l + (D.critical ? ' <span class="chip o" style="font-size:10px;padding:2px 7px">critique</span>' : '') + '</span><span class="tn">' + D.score + '</span></div><div class="t"><i style="width:' + D.score + '%"></i></div></div>';
  }).join('');
}
function debugBlock(r, rank) {
  var rows = CP.DIMS.map(function (d) { var D = r.dims[d.id]; return '<tr><td>' + d.l + (D.critical ? ' (critique)' : '') + '</td><td>' + (D.score === null ? '—' : D.score) + '</td></tr>'; }).join('');
  function li(arr, sign) { return arr.length ? arr.map(function (x) { return '<tr><td>' + esc(x.l) + '</td><td>' + sign + x.v + '</td></tr>'; }).join('') : '<tr><td>Aucun</td><td></td></tr>'; }
  var miss = r.missing.length ? r.missing.map(function (m) { return esc(m.label); }).join(', ') : 'Aucune information importante manquante';
  var why;
  if (r.eliminated) why = 'Éliminée par filtre strict : ' + r.elim.join(', ') + '.';
  else {
    var best = null, worst = null;
    CP.DIMS.forEach(function (d) { var D = r.dims[d.id]; if (D.score === null) return; if (!best || D.score > best.s) best = { l: d.l, s: D.score }; if (!worst || D.score < worst.s) worst = { l: d.l, s: D.score }; });
    why = 'Classée n°' + rank + '. Point fort : ' + (best ? best.l + ' (' + best.s + ')' : '—') + '. Point faible : ' + (worst ? worst.l + ' (' + worst.s + ')' : '—') + '. Score de base ' + r.base + ', confiance ' + r.conf + ' %.';
  }
  return '<div class="dbg"><table>' + rows + '</table>' +
    '<b style="color:var(--ink)">Bonus</b><table>' + li(r.bonus, '+') + '</table>' +
    '<b style="color:var(--ink)">Pénalités et plafonds</b><table>' + li(r.pen.concat(r.caps).concat(r.weak), '−') + '</table>' +
    '<b style="color:var(--ink)">Filtres stricts</b><span>' + (r.elim.length ? esc(r.elim.join(', ')) : 'Aucun filtre déclenché') + '</span>' +
    '<b style="color:var(--ink)">Informations manquantes</b><span>' + miss + '</span>' +
    '<b style="color:var(--ink)">Raison du classement</b><span>' + esc(why) + '</span></div>';
}
function vResult() {
  var ev = evalDiag(), P = ev.P;
  var pivotFrom = S.ui.pivotFrom && S.project && S.project.status === 'pivot' ? S.ui.pivotFrom : null;
  var alive = ev.ranking.filter(function (r) { return !r.eliminated && r.id !== pivotFrom; });
  if (!alive.length) return '<div class="card stack" style="margin-top:16px"><h2>Aucune stratégie compatible</h2><p class="muted">Tes refus éliminent toutes les stratégies du catalogue. Tu peux refaire le diagnostic en assouplissant un refus.</p><button class="btn pri" data-act="restart-ask">Refaire le diagnostic</button></div>';
  var b = alive[0], ex = CP.explain(b, P), conf = ev.conf.pct;
  var lowConf = conf < 80;
  var s = b.s;
  var head = pivotFrom ? '<div class="notice v">Pivot : choisis une nouvelle stratégie. L’ancienne (' + esc(STRAT_BY_ID[pivotFrom].name) + ') est exclue de cette liste.</div>' : '';
  var thr = b.score < 80 ? '<div class="notice">Aucune stratégie n’atteint actuellement notre seuil de forte compatibilité (80 %).<br><b>Meilleure correspondance actuelle : ' + b.score + ' %.</b></div>' : '';
  var cf = lowConf ? '<div class="notice v">Compatibilité provisoire : avec ce que nous savons, cette piste semble ' + (b.score >= 80 ? 'excellente' : 'la meilleure') + ', mais la confiance du diagnostic est encore de ' + conf + ' %. Quelques questions de plus la rendront plus fiable.<button class="btn sm" style="margin-top:10px" data-act="refine">Affiner mon diagnostic</button></div>' : '';
  var tie = alive.length > 1 && alive[0].score - alive[1].score <= 2 ? '<p class="muted small">« ' + esc(alive[1].s.name) + ' » est presque à égalité : regarde aussi les alternatives.</p>' : '';
  var adv = ex.advantages.length ? '<ul class="list">' + ex.advantages.map(function (a) { return '<li>' + esc(a) + '</li>'; }).join('') + '</ul>' : '<p class="muted">Pas encore assez d’informations pour détailler les avantages.</p>';
  var facts = '<div class="facts"><div><small>Capital minimum</small><b>' + (s.capitalMin ? eur(s.capitalMin) : 'Aucun') + '</b></div><div><small>Temps minimum</small><b>' + s.hoursMin + ' h / semaine</b></div>' +
    '<div><small>Premiers revenus</small><b>≈ ' + s.validationWeeks + ' semaines</b></div><div><small>Clients</small><b>' + (s.market === 'B2B' ? 'Entreprises' : (s.market === 'B2C' ? 'Particuliers' : 'Mixte')) + ' · ' + (s.nature === 'digital' ? 'Digital' : (s.nature === 'physique' ? 'Terrain' : 'Hybride')) + '</b></div>' +
    '<div><small>Récurrence</small><b>' + level(s.recurrence) + '</b></div><div><small>Scalabilité</small><b>' + level(s.scalability) + '</b></div></div>';
  var alts = alive.slice(1, 5).map(function (r) {
    return '<div class="alt"><span class="sc tn">' + r.score + '<span class="small muted"> %</span></span><span class="nm"><b>' + esc(r.s.name) + '</b><span>Confiance ' + r.conf + ' % · ' + esc(r.s.cat) + '</span></span><button class="btn xs" data-act="launch-ask" data-sid="' + r.id + '">Choisir</button></div>';
  }).join('');
  var full = ev.ranking.map(function (r, i) {
    return '<details class="rk' + (r.eliminated ? ' elim' : '') + '"><summary><span class="pos tn">' + (i + 1) + '</span><span class="nm">' + esc(r.s.name) + (r.eliminated ? ' <span class="chip r" style="font-size:10px;padding:2px 7px">éliminée</span>' : '') + '</span><span class="sc tn">' + r.score + '</span></summary>' + debugBlock(r, i + 1) + '</details>';
  }).join('');
  var launchBtn = S.project && S.project.status === 'active' && S.project.strategyId === b.id ? '<button class="btn pri" data-act="open-space">Ouvrir mon espace</button>' : '<button class="btn pri" data-act="launch-ask" data-sid="' + b.id + '">Lancer ce projet</button>';
  return head + '<div class="ph"><span class="eyebrow">' + (b.score >= 80 ? 'Ta meilleure correspondance' : 'Meilleure correspondance actuelle') + '</span></div>' +
    '<div class="card hl stack"><div class="between"><span class="chip v">' + esc(s.cat) + '</span>' + (S.diag.simulated ? '<span class="chip y">Profil test ' + esc(S.diag.simulated) + '</span>' : '') + '</div>' +
    '<h1 style="font-size:28px">' + esc(s.name) + '</h1><p class="muted">' + esc(ex.summary) + '</p>' +
    '<div class="score"><div><div class="big tn">' + b.score + ' %</div><div class="lbl">' + (lowConf ? 'Compatibilité provisoire' : 'Compatibilité') + '</div></div><div><div class="big tn" style="color:' + (conf >= 80 ? 'var(--green)' : 'var(--yellow)') + '">' + conf + ' %</div><div class="lbl">Confiance du diagnostic</div></div></div>' + tie + '</div>' +
    '<div class="stack" style="margin-top:14px">' + thr + cf +
    '<div class="card stack"><h3>Pourquoi cette stratégie</h3>' + adv + '</div>' +
    '<div class="card stack"><h3>Principal point faible</h3><ul class="list warn"><li>' + esc(ex.weak || 'Aucun point faible majeur détecté.') + '</li></ul></div>' +
    '<div class="card stack"><h3>Sous-scores</h3><div class="dims">' + dimRows(b) + '</div></div>' +
    '<div class="card stack"><h3>En pratique</h3>' + facts + '<p class="muted small"><b>Critère d’entrée :</b> ' + esc(s.entry) + '</p></div>' +
    launchBtn +
    '<div class="card stack"><h3>Alternatives</h3>' + (alts || '<p class="muted">Aucune autre stratégie compatible.</p>') + '</div>' +
    '<div class="card stack"><div class="between"><h3>Classement complet</h3><span class="chip">' + ev.ranking.length + ' stratégies</span></div><p class="muted small">Mode développement : touche une ligne pour voir les sous-scores, bonus, pénalités, filtres et informations manquantes.</p>' + full + '</div>' +
    '<div class="row" style="justify-content:center;gap:18px;flex-wrap:wrap;margin:6px 0 30px"><button class="link" data-act="refine">Répondre à plus de questions</button><button class="link" data-act="lab">Labo de test</button><button class="link" data-act="home">Accueil</button></div></div>';
}
function level(x) { return x >= 0.75 ? 'Élevée' : (x >= 0.45 ? 'Moyenne' : 'Faible'); }

/* ---------- labo ---------- */
function vLab() {
  var rows = Object.keys(LAB_PERSONAS).map(function (k) {
    return '<div class="alt"><span class="sc">' + k + '</span><span class="nm"><b>' + esc(LAB_NAMES[k].slice(4)) + '</b></span><button class="btn xs" data-act="lab-run" data-k="' + k + '">Simuler</button></div>';
  }).join('');
  var cmp = UI.labCmp || '';
  return '<div class="ph"><span class="eyebrow">Mode test</span><h1>Labo de test</h1></div><p class="muted">Chaque profil répond automatiquement au vrai questionnaire adaptatif. Ça permet de vérifier que des profils opposés obtiennent des classements réellement différents.</p>' +
    '<div class="stack" style="margin-top:16px">' + rows + '<button class="btn" data-act="lab-compare">Comparer les 5 profils</button>' + cmp + '<button class="btn ghost" data-act="home">← Accueil</button></div>';
}
function labCompare() {
  var res = {}, keys = Object.keys(LAB_PERSONAS);
  keys.forEach(function (k) { var r = LAB.simulate(LAB_PERSONAS[k]); res[k] = { n: r.diag.order.length, conf: r.ev.conf.pct, top: r.ev.ranking.filter(function (x) { return !x.eliminated; }).slice(0, 5), el: r.ev.ranking.filter(function (x) { return x.eliminated; }).length }; });
  var th = '<tr><th></th>' + keys.map(function (k) { return '<th>' + k + '</th>'; }).join('') + '</tr>';
  var body = [0, 1, 2, 3, 4].map(function (i) { return '<tr><th>' + (i + 1) + '</th>' + keys.map(function (k) { var x = res[k].top[i]; return '<td>' + (x ? esc(x.s.name) + ' <b>' + x.score + '</b>' : '—') + '</td>'; }).join('') + '</tr>'; }).join('');
  var meta = '<tr><th>Q.</th>' + keys.map(function (k) { return '<td>' + res[k].n + ' questions · ' + res[k].conf + ' % · ' + res[k].el + ' éliminées</td>'; }).join('') + '</tr>';
  UI.labCmp = '<div class="card scroll-x"><table class="cmp">' + th + body + meta + '</table></div>';
  render();
}

/* ---------- espace projet ---------- */
function vSpace() {
  var t = S.ui.tab;
  if (t === 'plan') return vPlan();
  if (t === 'track') return vTrack();
  if (t === 'review') return vReview();
  if (t === 'history') return vHistory();
  if (t === 'profile') return vProfile();
  return vToday();
}
function spaceHead(title) {
  var p = proj(), per = PROJ.currentPeriod(p);
  var stg = PROJ.STAGES.map(function (x, i) { return '<i class="' + (i < per.stage ? 'd' : (i === per.stage ? 'c' : '')) + '"></i>'; }).join('');
  return '<div class="ph"><div class="between"><span class="eyebrow">' + esc(p.name) + '</span><span class="chip">Période ' + per.n + '</span></div><h1>' + title + '</h1></div><div class="stg" style="margin:10px 0 4px">' + stg + '</div><p class="muted small">Étape : ' + esc(per.title) + '</p>';
}
function taskRow(t) {
  return '<button class="task ' + t.status + '" data-act="task-open" data-id="' + esc(t.id) + '"><span class="dot"></span><span class="tx"><b>' + esc(t.title) + '</b><span>' + (t.qty ? t.qty + ' ' + esc(t.unit) + ' · ' : '') + '≈ ' + t.est + ' min · ' + STATUS[t.status] + (t.remedial ? ' · correction' : '') + '</span></span></button>';
}
function vToday() {
  var p = proj(), per = PROJ.currentPeriod(p), tasks = per.tasks;

  var todo = tasks.filter(function (t) { return t.status === 'todo'; });

  if (next) {

      '<div class="row small muted">' + (next.qty ? '<span class="chip">' + next.qty + ' ' + esc(next.unit) + '</span>' : '') + '<span class="chip">≈ ' + next.est + ' min</span></div>' +
      '<div class="grid2">' + (next.status === 'doing' ? '<button class="btn pri" data-act="quick-status" data-id="' + next.id + '" data-st="done">Terminé</button>' : '<button class="btn pri" data-act="quick-status" data-id="' + next.id + '" data-st="doing">Commencer</button>') +
      '<button class="btn" data-act="quick-status" data-id="' + next.id + '" data-st="blocked">Bloqué</button></div><button class="link" data-act="task-open" data-id="' + next.id + '">Voir le détail</button></div>';
  } else if (blocked.length) {
    prio = '<div class="card prio stack"><span class="eyebrow" style="color:var(--yellow)">À faire maintenant</span><h2 style="font-size:22px">Débloquer tes tâches</h2><p class="muted">Toutes les autres tâches sont faites. Ouvre une tâche bloquée, ou fais ton bilan : CashPilot proposera une correction.</p><button class="btn pri" data-act="tab" data-tab="review">Faire mon bilan</button></div>';
  } else {
    prio = '<div class="card prio stack"><span class="eyebrow" style="color:var(--yellow)">Période terminée</span><h2 style="font-size:22px">Fais ton bilan</h2><p class="muted">Tu as terminé toutes les tâches. Pas besoin d’attendre : le bilan décide de la suite.</p><button class="btn pri" data-act="tab" data-tab="review">Faire mon bilan</button></div>';
  }
  var m = PROJ.sumEntries(p.entries, per.id), L = PROJ.labels(p.family);
  var tg = Object.keys(per.targets).map(function (k) { var a = m[k] || 0, t = per.targets[k]; return '<div class="dim ' + (a >= t ? 'hi' : '') + '"><div class="between"><span>' + esc(L[k]) + '</span><span class="tn">' + a + ' / ' + t + '</span></div><div class="t"><i style="width:' + Math.min(100, Math.round(100 * a / Math.max(t, 1))) + '%"></i></div></div>'; }).join('');
  return spaceHead('Aujourd’hui') + '<div class="stack" style="margin-top:12px">' + prio +
    '<div class="card stack"><div class="between"><h3>Cette période</h3><span class="muted small tn">' + done.length + ' / ' + tasks.length + ' terminées</span></div><p class="muted small">' + esc(per.objective) + '</p>' + (tg ? '<div class="dims">' + tg + '</div>' : '') +
    '<button class="btn sm" data-act="entry-open" style="width:100%">+ Enregistrer un résultat</button></div>' +
    (blocked.length ? '<div class="card stack"><h3>À débloquer</h3>' + blocked.map(taskRow).join('') + '</div>' : '') + '</div>';
}
function vPlan() {

    var dn = pp.tasks.filter(function (t) { return t.status === 'done'; }).length;
    return '<div class="alt"><span class="sc small">P' + pp.n + '</span><span class="nm"><b>' + esc(pp.title) + '</b><span>' + dn + '/' + pp.tasks.length + ' tâches · décision : ' + esc(pp.decision || '—') + '</span></span></div>';
  }).join('');
  var traj = PROJ.STAGES.map(function (x, i) { return '<div class="alt"><span class="sc small">' + (i < per.stage ? '✓' : (i === per.stage ? '●' : (i + 1))) + '</span><span class="nm"><b>' + x + '</b><span>' + esc(PROJ.STAGE_GOALS[i]) + '</span></span></div>'; }).join('');
  return spaceHead('Plan') + '<div class="stack" style="margin-top:12px"><div class="card stack"><h3>Période ' + per.n + ' — ' + esc(per.title) + '</h3><p class="muted small">' + esc(per.objective) + (per.reason ? ' · ' + esc(per.reason) : '') + '</p>' + per.tasks.map(taskRow).join('') +
    '<p class="muted small">La période suivante est générée à partir de ton bilan, pas du calendrier.</p></div>' +
    '<details class="rk"><summary><span class="nm">Trajectoire générale</span></summary><div class="dbg">' + traj + '</div></details>' +
    (past ? '<div class="card stack"><h3>Périodes précédentes</h3>' + past + '</div>' : '') + '</div>';
}
function kpis(m, L) {
  var profit = m.revenue - m.expenses, rr = m.contacts > 0 ? m.responses / m.contacts : null, cv = m.conversations > 0 ? (m.clients + m.sales) / m.conversations : null, vh = m.minutes > 0 ? profit / (m.minutes / 60) : null;
  function k(l, v, cls) { return '<div class="kpi"><small>' + esc(l) + '</small><b class="tn ' + (cls || '') + '">' + v + '</b></div>'; }
  return '<div class="kpis">' + k(L.contacts, m.contacts) + k(L.responses, m.responses) + k(L.conversations, m.conversations) + k(L.clients, m.clients) + k(L.sales, m.sales) + k('Revenus', eur(m.revenue), m.revenue > 0 ? 'pos' : '') +
    k('Dépenses', eur(m.expenses)) + k('Profit', eur(profit), profit > 0 ? 'pos' : '') + k('Temps investi', Math.round(m.minutes / 60 * 10) / 10 + ' h') + k('Taux de réponse', pct(rr)) + k('Conversion', pct(cv)) + k('Valeur par heure', vh === null ? '—' : eur(vh)) + '</div>';
}
function vTrack() {
  var p = proj(), per = PROJ.currentPeriod(p), L = PROJ.labels(p.family);
  var mp = PROJ.sumEntries(p.entries, per.id), mt = PROJ.sumEntries(p.entries);
  var list = p.entries.slice().reverse().map(function (e) {
    var parts = []; PROJ.METRIC_KEYS.forEach(function (k) { if (e[k]) parts.push((k === 'revenue' || k === 'expenses') ? L[k].replace(' (€)', '') + ' ' + eur(e[k]) : (k === 'minutes' ? e[k] + ' min' : e[k] + ' ' + L[k].toLowerCase())); });
    return '<div class="alt' + (e.cancelled ? ' elim' : '') + '"><span class="nm"><b>' + esc(parts.join(' · ') || '—') + '</b><span>' + fmtDate(e.at) + (e.note ? ' · ' + esc(e.note) : '') + (e.cancelled ? ' · annulée' : '') + '</span></span>' + (!e.cancelled && !e.correctionOf ? '<button class="btn xs ghost" data-act="entry-cancel-ask" data-id="' + e.id + '">Annuler</button>' : '') + '</div>';
  }).join('');
  return spaceHead('Résultats') + '<div class="stack" style="margin-top:12px"><button class="btn pri" data-act="entry-open">+ Enregistrer des résultats</button>' +
    '<div class="card stack"><h3>Période en cours</h3>' + kpis(mp, L) + '</div><div class="card stack"><h3>Depuis le début</h3>' + kpis(mt, L) + '</div>' +
    '<div class="card stack"><h3>Saisies</h3>' + (list || '<p class="muted">Aucune saisie pour l’instant.</p>') + '<p class="muted small">Une saisie n’est jamais modifiée : l’annuler crée une correction visible dans l’historique.</p></div></div>';
}
function vReview() {
  var p = proj(), s = strat(), per = PROJ.currentPeriod(p), an = PROJ.analyze(p, s), L = PROJ.labels(p.family);
  var sel = UI.decision || an.decision;
  var tgt = Object.keys(per.targets).map(function (k) { return '<div class="between small"><span>' + esc(L[k]) + '</span><b class="tn">' + (an.m[k] || 0) + ' / ' + per.targets[k] + '</b></div>'; }).join('');
  var blk = Object.keys(an.reasons).map(function (r) { var l = ''; PROJ.BLOCK_REASONS.forEach(function (b) { if (b.id === r) l = b.l; }); return '<li>' + esc(l) + ' (' + an.reasons[r] + ')</li>'; }).join('');
  var decs = DECISIONS.map(function (d) { return '<button class="' + (d === an.decision ? 'rec ' : '') + (d === sel ? 'on' : '') + '" data-act="decision" data-d="' + d + '">' + d + '</button>'; }).join('');
  var empty = an.cnt.done === 0 && !p.entries.some(function (e) { return e.periodId === per.id; });
  return spaceHead('Bilan') + '<div class="stack" style="margin-top:12px">' +
    '<div class="card stack"><h3>Ce qui s’est passé</h3><div class="kpis"><div class="kpi"><small>Tâches terminées</small><b class="tn">' + an.cnt.done + ' / ' + per.tasks.length + '</b></div><div class="kpi"><small>Bloquées</small><b class="tn">' + an.cnt.blocked + '</b></div>' +
    '<div class="kpi"><small>Revenus</small><b class="tn ' + (an.m.revenue > 0 ? 'pos' : '') + '">' + eur(an.m.revenue) + '</b></div><div class="kpi"><small>Durée</small><b class="tn">' + an.days + ' j</b></div></div>' +
    (tgt ? '<div class="stack" style="gap:6px">' + tgt + '</div>' : '') + (blk ? '<b>Blocages</b><ul class="list warn">' + blk + '</ul>' : '') +
    '<div class="between small"><span>Taux de réponse</span><b>' + pct(an.replyRate) + '</b></div><div class="between small"><span>Valeur par heure</span><b>' + (an.perHour === null ? '—' : eur(an.perHour)) + '</b></div></div>' +
    '<div class="card hl stack"><span class="eyebrow">Recommandation CashPilot</span><h2 style="font-size:26px;color:var(--yellow)">' + an.decision + '</h2><p class="muted">' + esc(DECISION_TXT[an.decision]) + '</p><ul class="list">' + an.why.map(function (w) { return '<li>' + esc(w) + '</li>'; }).join('') + '</ul></div>' +
    (empty ? '<div class="notice">Rien n’a encore été fait ni enregistré sur cette période. Le bilan sera plus utile après quelques actions.</div>' : '') +
    '<div class="card stack"><h3>Ta décision</h3><div class="dec">' + decs + '</div><p class="muted small">' + esc(DECISION_TXT[sel]) + '</p>' +
    '<button class="btn pri" data-act="close-period">Valider : ' + sel + '</button></div></div>';
}
function vHistory() {
  var groups = {}, order = [];
  S.history.slice().reverse().forEach(function (h) { var d = fmtDay(h.at); if (!groups[d]) { groups[d] = []; order.push(d); } groups[d].push(h); });
  var IC = { diag: '◎', start: '★', period: '▤', task: '✓', block: '!', entry: '+', win: '€', decision: '⇢', pivot: '↺', stop: '■', correction: '±' };
  var html = order.map(function (d) {
    return '<div class="d">' + esc(d) + '</div>' + groups[d].map(function (h) {
      var extra = h.data && h.data.compat !== undefined ? 'Compatibilité : ' + h.data.compat + ' % · confiance ' + h.data.conf + ' %' : '';
      return '<div class="e"><span class="ic">' + (IC[h.type] || '•') + '</span><div><b>' + esc(h.text) + '</b>' + (extra ? '<span>' + esc(extra) + '</span>' : '') + '<span>' + new Date(h.at).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) + '</span></div></div>';
    }).join('');
  }).join('');
  return spaceHead('Historique') + '<div class="card" style="margin-top:12px"><div class="tl">' + (html || '<p class="muted">Rien pour l’instant.</p>') + '</div></div><p class="muted small" style="margin-top:10px">Le journal n’est jamais réécrit : chaque correction ajoute une nouvelle ligne.</p>';
}
function vProfile() {
  var ev = evalDiag(), P = ev.P, p = proj();
  var groups = TRAIT_GROUPS.map(function (g) {
    var rows = g.keys.filter(function (k) { return P[k]; }).map(function (k) {
      var t = P[k];
      return '<div class="trait"><span>' + esc(TRAIT_LABELS[k] || k) + '</span><div><b>' + esc(formatTrait(k, t.v)) + '</b><em>' + esc(SRC_LABELS[t.src] || t.src) + ' · confiance ' + t.conf + ' %</em></div></div>';
    }).join('');
    var unknown = g.keys.filter(function (k) { return !P[k]; }).length;
    return '<details class="rk"><summary><span class="nm">' + esc(g.l) + '</span><span class="muted small">' + (g.keys.length - unknown) + ' connus · ' + unknown + ' inconnus</span></summary><div class="dbg">' + (rows || '<span>Aucune information.</span>') + '</div></details>';
  }).join('');
  return spaceHead('Profil') + '<div class="stack" style="margin-top:12px"><div class="card stack"><h3>Ton projet</h3><p><b>' + esc(p.name) + '</b></p><p class="muted small">Choisi le ' + fmtDate(p.startedAt) + ' · compatibilité ' + p.compatibility + ' % · confiance ' + p.confidence + ' %</p>' +
    '<button class="btn sm" data-act="open-result" style="width:100%">Voir mon diagnostic</button></div>' +
    '<div class="card stack"><h3>Ton profil humain</h3><p class="muted small">Chaque information indique sa source et sa confiance. Une information jamais demandée reste inconnue : elle n’est jamais remplacée par une moyenne.</p>' + groups + '</div>' +
    '<button class="btn" data-act="restart-ask">Refaire le diagnostic</button><button class="btn danger" data-act="reset-ask">Réinitialiser toutes les données</button>' +
    '<p class="muted small" style="text-align:center">Les opportunités arriveront dans une prochaine version.</p></div>';
}

/* ---------------- événements ---------------- */
function onClick(e) {
  var el = e.target;
  while (el && el !== document.body && !(el.getAttribute && el.getAttribute('data-act'))) el = el.parentNode;
  if (!el || el === document.body || !el.getAttribute) return;
  var act = el.getAttribute('data-act');
  try { handle(act, el); } catch (err) { showError(err); }
}
function handle(act, el) {
  var d = S.diag;
  switch (act) {
    case 'start': startDiag(true); break;
    case 'resume': startDiag(false); break;
    case 'restart-ask': confirmSheet('Recommencer le diagnostic ?', 'Tes réponses actuelles seront remplacées. Ton projet en cours et ton historique sont conservés.', 'restart', 'Recommencer'); break;
    case 'restart': closeSheet(); startDiag(true); break;
    case 'quit': save(); go('landing'); break;
    case 'home': S.ui.pivotFrom = null; go('landing'); break;
    case 'err-home': S.ui.screen = 'landing'; save(); render(); break;
    case 'notice-ok': S.notice = null; save(); render(); break;
    case 'open-space': go('space', S.ui.tab || 'today'); break;
    case 'open-result': if (d.done) go('result'); else startDiag(false); break;
    case 'refine': refineDiag(); break;
    case 'lab': UI.labCmp = ''; go('lab'); break;
    case 'lab-run':
      var k = el.getAttribute('data-k');
      if (d.order.length && !d.simulated) { confirmSheet('Remplacer ton diagnostic ?', 'La simulation du profil ' + k + ' remplace tes réponses actuelles (ton projet reste intact).', 'lab-run-ok', 'Simuler'); UI.labK = k; break; }
      UI.labK = k; handle('lab-run-ok', el); break;
    case 'lab-run-ok':
      closeSheet();
      var r = LAB.simulate(LAB_PERSONAS[UI.labK]); r.diag.simulated = UI.labK;
      S.diag = r.diag; EV_CACHE.key = null;
      addHistory('diag', 'Profil test ' + UI.labK + ' simulé (' + r.diag.order.length + ' questions)');
      go('result'); break;
    case 'lab-compare': labCompare(); break;
    case 'ans': var q = currentQuestion(); if (q) answer(q, Number(el.getAttribute('data-i'))); break;
    case 'multi':
      var i = el.getAttribute('data-i'); var v = i === 'none' ? 'none' : Number(i);
      if (v === 'none') UI.multi = UI.multi.indexOf('none') >= 0 ? [] : ['none'];
      else { UI.multi = UI.multi.filter(function (x) { return x !== 'none'; }); var pos = UI.multi.indexOf(v); if (pos >= 0) UI.multi.splice(pos, 1); else UI.multi.push(v); }
      render(); break;
    case 'multi-ok': var qm = currentQuestion(); if (qm && UI.multi.length) answer(qm, UI.multi.slice()); break;
    case 'back': back(); break;
    case 'launch-ask':
      var sid = el.getAttribute('data-sid'), s = STRAT_BY_ID[sid];
      UI.launchSid = sid;
      if (S.project && S.project.status === 'active') confirmSheet('Changer de projet ?', 'Ton projet « ' + S.project.name + ' » sera archivé (son historique est conservé) et « ' + s.name + ' » démarrera.', 'launch', 'Lancer ' + s.name);
      else confirmSheet('Lancer « ' + s.name + ' » ?', 'CashPilot va créer ta première période : quelques actions concrètes pour valider cette piste. La suite dépendra de tes résultats.', 'launch', 'Lancer le projet');
      break;
    case 'launch': S.ui.pivotFrom = null; launch(UI.launchSid); break;
    case 'tab': S.ui.tab = el.getAttribute('data-tab'); UI.decision = null; save(); render(); try { window.scrollTo(0, 0); } catch (e) {} break;
    case 'task-open': openTaskSheet(el.getAttribute('data-id')); break;
    case 'task-status':
      var tid = el.getAttribute('data-id'), st = el.getAttribute('data-st');
      saveTaskFields(tid);
      if (st === 'blocked') openBlockSheet(tid); else { setStatus(tid, st); openTaskSheet(tid); }
      break;
    case 'task-save': saveTaskFields(el.getAttribute('data-id')); save(); closeSheet(); render(); toast('Tâche enregistrée'); break;
    case 'quick-status':
      var qid = el.getAttribute('data-id'), qst = el.getAttribute('data-st');
      if (qst === 'blocked') openBlockSheet(qid); else { setStatus(qid, qst); if (qst === 'done') toast('Bien joué ✓'); }
      break;
    case 'block-reason':
      var bn = $('blockNote');
      setStatus(el.getAttribute('data-id'), 'blocked', el.getAttribute('data-reason'), bn ? bn.value.trim() : '');
      closeSheet(); toast('Blocage enregistré'); break;
    case 'entry-open': openEntrySheet(); break;
    case 'entry-save':
      var vals = {}; PROJ.METRIC_KEYS.forEach(function (k) { var inp = $('m_' + k); vals[k] = inp ? Math.max(-1e9, Number(inp.value) || 0) : 0; if (vals[k] < 0) vals[k] = 0; });
      var nt = $('m_note'); vals.note = nt ? nt.value.trim().slice(0, 200) : '';
      if (addEntry(vals)) { closeSheet(); render(); toast('Résultats enregistrés'); }
      break;
    case 'entry-cancel-ask': UI.cancelId = el.getAttribute('data-id'); confirmSheet('Annuler cette saisie ?', 'Une correction sera ajoutée pour neutraliser ces chiffres. La saisie d’origine reste visible dans l’historique.', 'entry-cancel', 'Annuler la saisie', true); break;
    case 'entry-cancel': closeSheet(); correctEntry(UI.cancelId); break;
    case 'decision': UI.decision = el.getAttribute('data-d'); render(); break;
    case 'close-period':
      var p = proj(), an = PROJ.analyze(p, strat()), dec = UI.decision || an.decision;
      UI.pendingDecision = dec;
      var txt = dec === 'PIVOTER' ? 'Tu vas choisir une nouvelle stratégie. Ce projet sera archivé avec son historique.' : (dec === 'ARRÊTER' ? 'Le projet sera mis en pause et archivé. Tu pourras en relancer un depuis l’accueil.' : 'La période ' + PROJ.currentPeriod(p).n + ' sera clôturée et la suivante générée à partir de ce bilan.');
      confirmSheet('Valider la décision ' + dec + ' ?', txt, 'close-period-ok', 'Valider');
      break;
    case 'close-period-ok': var dd = UI.pendingDecision; UI.decision = null; closePeriod(dd); break;
    case 'reset-ask': confirmSheet('Réinitialiser toutes les données ?', 'Diagnostic, projet, résultats et historique seront supprimés de cet appareil. Cette action est définitive.', 'reset', 'Tout supprimer', true); break;
    case 'reset': try { window.localStorage.removeItem(STORE_KEY); } catch (e) {} S = freshState(); EV_CACHE.key = null; UI = { multi: [], openTask: null, toastT: null }; closeSheet(); save(); render(); toast('Données réinitialisées'); break;
    case 'sheet-close': closeSheet(); break;
  }
}
function saveTaskFields(id) {
  var t = findTask(id); if (!t) return;
  var r = $('tResult'), n = $('tNotes');
  if (r) t.result = r.value.slice(0, 1000);
  if (n) t.notes = n.value.slice(0, 1000);
}

/* ---------------- démarrage ---------------- */
function boot() {
  try {
    S = loadState();
    save();
    document.addEventListener('click', onClick);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });
    render();
  } catch (err) {
    try { S = freshState(); } catch (e2) {}
    showError(err);
  }
}
window.addEventListener('error', function (ev) { try { console.error('CashPilot :', ev.error || ev.message); } catch (e) {} });
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

</script>
</body>
</html>
